<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آفلاین هستید — مرکز آموزش علمی–کاربردی کمیته امداد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Vazirmatn, Tahoma, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0b5d51, #147a68, #0b5d51);
      color: #fff; padding: 1.5rem; text-align: center;
    }
    .box { max-width: 420px; }
    .icon { font-size: 64px; margin-bottom: 1rem; }
    h1 { font-size: 1.35rem; margin-bottom: .75rem; }
    p { font-size: .9rem; opacity: .85; line-height: 2; margin-bottom: 1.5rem; }
    button {
      background: #c9a227; color: #1f1a03; border: 0; cursor: pointer;
      padding: .8rem 2rem; border-radius: .8rem; font-weight: 700;
      font-family: inherit; font-size: .95rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>اتصال اینترنت در دسترس نیست</h1>
    <p>صفحات بازدیدشدهٔ اخیر را می‌توانید آفلاین ببینید. برای مشاهدهٔ محتوای جدید، اتصال اینترنت را بررسی و دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش مجدد</button>
  </div>
</body>
</html>
